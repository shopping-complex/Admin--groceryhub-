<!DOCTYPE html>
<html lang="en" class="scroll-smooth select-none">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>👑 Admin Portal | Grocery Hub</title>
    
    <link rel="preconnect" href="https://www.googleapis.com">
    <link rel="preconnect" href="https://www.gstatic.com">
    <link rel="preconnect" href="https://cdn.tailwindcss.com">
    
    <meta name="robots" content="noindex, nofollow">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="X-Frame-Options" content="DENY">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        forest: '#022C22',
                        emerald: '#059669',
                        light: '#F4F4F5',
                        dark: '#0f172a',
                    },
                    fontFamily: {
                        serif: ['Playfair Display', 'serif'],
                        sans: ['Plus Jakarta Sans', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body { background: #F4F4F5; color: #022C22; overflow-x: hidden; font-family: 'Plus Jakarta Sans', sans-serif; min-height: 100vh; }
        .glass-panel { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(5, 150, 105, 0.15); box-shadow: 0 10px 40px rgba(2, 44, 34, 0.08); }
        .input-premium { background: rgba(255,255,255,0.8); border: 1px solid #e2e8f0; color: #022C22; transition: all 0.3s; }
        .input-premium:focus { border-color: #059669; box-shadow: 0 0 0 4px rgba(5, 150, 105, 0.15); outline: none; }
        .input-premium::placeholder { color: #94a3b8; }
        
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
        
        .tab-btn.active { background: linear-gradient(135deg, #022C22, #059669); color: white; box-shadow: 0 8px 25px rgba(5, 150, 105, 0.4); border-color: transparent; }
        .tab-btn { background: rgba(255,255,255,0.8); color: #475569; border: 1px solid #e2e8f0; }
        .tab-btn:hover { background: rgba(5, 150, 105, 0.1); color: #022C22; }
        
        .size-btn.selected, .variant-btn.selected { background: #059669 !important; color: white !important; border-color: #059669 !important; box-shadow: 0 0 20px rgba(5, 150, 105, 0.3); }
        .size-btn, .variant-btn { transition: all 0.3s ease; cursor: pointer; border: 1px solid #e2e8f0; background: rgba(255,255,255,0.8); color: #022C22; }
        .size-btn:hover, .variant-btn:hover { border-color: #059669; }
        
        .vip-glow:hover { box-shadow: 0 0 35px rgba(5, 150, 105, 0.2); transform: translateY(-2px); }
        .vip-glow { transition: all 0.4s ease; }

        @keyframes slideInDown { from { transform: translateY(-100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .toast-enter { animation: slideInDown 0.4s cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
        
        .order-tab.active { background: #059669; color: white; box-shadow: 0 0 25px rgba(5, 150, 105, 0.3); border-radius: 12px; }
        .order-tab { cursor: pointer; transition: all 0.3s; color: #64748b; padding: 10px 16px; border-radius: 12px; font-weight: 700; font-size: 11px; text-transform: uppercase; }
        .order-tab:hover { background: rgba(5, 150, 105, 0.1); color: #022C22; }

        .emerald-border-glow { border-color: #059669; box-shadow: 0 0 25px rgba(5, 150, 105, 0.1); }
        .btn-emerald { background: #059669; color: white; box-shadow: 0 0 30px rgba(5, 150, 105, 0.3); transition: all 0.3s; border: none; cursor: pointer; font-weight: 700; }
        .btn-emerald:hover { box-shadow: 0 0 40px rgba(5, 150, 105, 0.5); transform: scale(1.02); background: #047857; }
        .btn-emerald:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        .btn-website { background: linear-gradient(135deg, #022C22, #059669); color: white; box-shadow: 0 0 35px rgba(5, 150, 105, 0.3); transition: all 0.3s; }
        .btn-website:hover { box-shadow: 0 0 50px rgba(5, 150, 105, 0.5); transform: scale(1.05); }

        .badge-vip { background: rgba(5, 150, 105, 0.15); border: 1px solid rgba(5, 150, 105, 0.4); padding: 4px 12px; border-radius: 100px; font-size: 9px; font-weight: 800; color: #059669; }
        
        #securityShield { position:fixed; top:0; left:0; right:0; bottom:0; background: rgba(2, 44, 34, 0.98); z-index:999999; display:none; justify-content:center; align-items:center; backdrop-filter:blur(30px); }
        #securityShield.show { display:flex; }
        .shield-box { background: rgba(5, 150, 105, 0.05); border: 2px solid rgba(5, 150, 105, 0.4); border-radius:24px; padding:40px 50px; max-width:480px; text-align:center; }
        .shield-box i { font-size:4.5rem; color:#059669; margin-bottom: 10px; }
        .shield-box h2 { font-size:1.8rem; font-weight:800; color:#059669; font-family: 'Playfair Display', serif; }
        .shield-box p { color:#cbd5e1; margin-top: 10px; }
        .shield-btn { margin-top:2.5rem; background:#059669; color:white; border:none; padding:14px 45px; border-radius:14px; font-weight:700; cursor:pointer; transition: all 0.3s; box-shadow: 0 10px 30px rgba(5,150,105,0.3);}
        .shield-btn:hover { transform: scale(1.05); box-shadow: 0 15px 40px rgba(5,150,105,0.5); }
        
        .order-card { border-left: 5px solid #059669; background: #ffffff; transition: transform 0.3s; }
        .order-card:hover { transform: translateY(-3px); }
        .order-card.success { border-left-color: #10b981; }
        .order-card.pending { border-left-color: #f59e0b; }
        .order-card.return { border-left-color: #8b5cf6; }
        .order-card.refund { border-left-color: #ec4899; }
        .order-card.cancelled { border-left-color: #ef4444; }
        
        .badge-success { background: #10b981; color: #fff; }
        .badge-pending { background: #f59e0b; color: #fff; }
        .badge-return { background: #8b5cf6; color: #fff; }
        .badge-refund { background: #ec4899; color: #fff; }
        .badge-cancelled { background: #ef4444; color: #fff; }
        
        .search-box { background: rgba(255,255,255,0.9); border: 2px solid #e2e8f0; border-radius: 14px; padding: 10px 16px 10px 45px; width: 100%; max-width: 400px; font-size: 13px; font-weight: 600; transition: all 0.3s; color: #022C22; }
        .search-box:focus { border-color: #059669; box-shadow: 0 0 0 4px rgba(5,150,105,0.15); outline: none; }
        
        @media (max-width:640px) { .glass-panel { padding: 16px !important; } .tab-btn { padding: 8px 12px; font-size: 9px; } .order-tab { padding: 8px 10px; font-size: 9px; } .search-box { max-width: 100%; } }
        ::selection { background: #059669; color: white; }
    </style>
</head>
<body class="min-h-screen flex flex-col pb-12">

    <div id="securityShield">
        <div class="shield-box">
            <i class="fas fa-shield-alt"></i>
            <h2>ACCESS DENIED</h2>
            <p>Unauthorized developer tools access detected.</p>
            <p style="font-size:11px; color:#059669; margin-top:12px; font-weight:bold; letter-spacing:1px;"><i class="fas fa-lock mr-1"></i> GROCERY HUB SECURE PORTAL</p>
            <button onclick="document.getElementById('securityShield').classList.remove('show')" class="shield-btn"><i class="fas fa-arrow-left mr-2"></i> Go Back</button>
        </div>
    </div>

    <div id="toast-container" class="fixed top-6 left-1/2 transform -translate-x-1/2 z-[100] flex flex-col gap-3 w-[90%] max-w-md"></div>

    <nav class="fixed top-0 w-full z-50 glass-panel py-3 px-4 md:px-6 flex justify-between items-center border-b border-emerald/20">
        <div class="text-emerald text-2xl"><i class="fas fa-leaf"></i></div>
        <div class="font-serif text-xl md:text-2xl tracking-tight text-forest font-bold flex items-center gap-2">
            Grocery <span class="text-emerald italic">Admin</span>
            <span class="badge-vip hidden sm:inline-block">PRO</span>
        </div>
        <div class="flex items-center gap-2 md:gap-4">
            <span class="text-[10px] text-emerald font-mono font-bold hidden md:block bg-emerald/10 px-3 py-1 rounded-full border border-emerald/20" id="sessionDisplay">SECURE</span>
            <a href="index.html" target="_blank" class="btn-website px-4 py-2 rounded-xl text-[10px] md:text-xs font-bold uppercase tracking-wider flex items-center gap-1 md:gap-2"><i class="fas fa-store"></i> <span class="hidden sm:inline">Store</span></a>
            <button onclick="logout()" class="bg-red-50 text-red-600 px-4 py-2 rounded-xl text-[10px] font-bold hover:bg-red-600 hover:text-white transition shadow-sm border border-red-100"><i class="fas fa-power-off"></i></button>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto w-full mt-[95px] px-4">
        <div class="flex overflow-x-auto hide-scroll gap-2 md:gap-3 pb-3 items-center md:justify-center">
            <button onclick="switchTab('products')" id="tab-products" class="tab-btn active shrink-0 px-5 md:px-6 py-3 rounded-xl text-[10px] md:text-xs font-bold uppercase tracking-wider transition-all"><i class="fas fa-plus-circle mr-1.5"></i> Add Product</button>
            <button onclick="switchTab('inventory')" id="tab-inventory" class="tab-btn shrink-0 px-5 md:px-6 py-3 rounded-xl text-[10px] md:text-xs font-bold uppercase tracking-wider transition-all"><i class="fas fa-boxes mr-1.5"></i> Inventory</button>
            <button onclick="switchTab('categories')" id="tab-categories" class="tab-btn shrink-0 px-5 md:px-6 py-3 rounded-xl text-[10px] md:text-xs font-bold uppercase tracking-wider transition-all"><i class="fas fa-tags mr-1.5"></i> Categories</button>
            <button onclick="switchTab('banners')" id="tab-banners" class="tab-btn shrink-0 px-5 md:px-6 py-3 rounded-xl text-[10px] md:text-xs font-bold uppercase tracking-wider transition-all"><i class="fas fa-image mr-1.5"></i> Promo Banners</button>
            <button onclick="switchTab('orders')" id="tab-orders" class="tab-btn shrink-0 px-5 md:px-6 py-3 rounded-xl text-[10px] md:text-xs font-bold uppercase tracking-wider transition-all"><i class="fas fa-truck-fast mr-1.5"></i> Deliveries</button>
        </div>
    </div>

    <main class="max-w-7xl mx-auto w-full px-4 mt-6 pb-10">
        
        <section id="section-products" class="space-y-6">
            <div class="flex items-center gap-3 border-b border-emerald/10 pb-3">
                <i class="fas fa-seedling text-3xl text-emerald"></i>
                <h2 class="font-serif text-3xl font-bold text-forest">Harvest Engine</h2>
            </div>
            
            <form id="productForm" class="glass-panel p-6 md:p-8 rounded-3xl space-y-6 vip-glow emerald-border-glow">
                <input type="hidden" id="editProductId">
                
                <div class="grid grid-cols-1 md:grid-cols-3 gap-5 md:gap-6">
                    <div class="md:col-span-2">
                        <label class="block text-xs text-forest uppercase tracking-wider mb-1.5 font-bold">Product Name</label>
                        <input type="text" id="pName" required placeholder="Premium Organic Avocados" class="w-full input-premium rounded-xl h-12 px-4 text-sm font-medium shadow-inner border-gray-200">
                    </div>
                    <div>
                        <label class="block text-xs text-forest uppercase tracking-wider mb-1.5 font-bold">Category</label>
                        <select id="pCategory" required class="w-full input-premium rounded-xl h-12 px-4 text-sm font-medium shadow-inner border-gray-200 cursor-pointer">
                            <option value="" disabled selected>Select Aisle</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs text-forest uppercase tracking-wider mb-1.5 font-bold">Regular Price (₹)</label>
                        <input type="number" id="pPrice" required placeholder="450" min="0" class="w-full input-premium rounded-xl h-12 px-4 text-sm font-bold shadow-inner border-gray-200 text-forest">
                    </div>
                    <div>
                        <label class="block text-xs text-emerald uppercase tracking-wider mb-1.5 font-bold">Offer Price (₹)</label>
                        <input type="number" id="pDiscount" placeholder="380 (Optional)" min="0" class="w-full input-premium rounded-xl h-12 px-4 text-sm font-bold shadow-inner border-emerald/30 text-emerald bg-emerald/5">
                    </div>
                    <div class="md:col-span-3">
                        <label class="block text-xs text-forest uppercase tracking-wider mb-1.5 font-bold">Harvest Details (Optional)</label>
                        <input type="text" id="pDesc" placeholder="Freshly plucked from local organic farms..." class="w-full input-premium rounded-xl h-12 px-4 text-sm font-medium shadow-inner border-gray-200">
                    </div>
                </div>

                <hr class="border-gray-100">

                <div>
                    <label class="block text-xs text-forest uppercase tracking-wider mb-3 font-bold flex items-center gap-2"><i class="fas fa-weight-hanging text-emerald"></i> Available Weights / Packs</label>
                    <div class="flex flex-wrap gap-2.5" id="sizeBoxAdult">
                        <button type="button" onclick="window.toggleSize(this, '100g')" class="size-btn px-4 h-11 rounded-xl font-bold text-xs shadow-sm">100g</button>
                        <button type="button" onclick="window.toggleSize(this, '250g')" class="size-btn px-4 h-11 rounded-xl font-bold text-xs shadow-sm">250g</button>
                        <button type="button" onclick="window.toggleSize(this, '500g')" class="size-btn px-4 h-11 rounded-xl font-bold text-xs shadow-sm">500g</button>
                        <button type="button" onclick="window.toggleSize(this, '1 Kg')" class="size-btn px-4 h-11 rounded-xl font-bold text-xs shadow-sm border-emerald/50 bg-emerald/5">1 Kg</button>
                        <button type="button" onclick="window.toggleSize(this, '2 Kg')" class="size-btn px-4 h-11 rounded-xl font-bold text-xs shadow-sm">2 Kg</button>
                        <button type="button" onclick="window.toggleSize(this, '5 Kg')" class="size-btn px-4 h-11 rounded-xl font-bold text-xs shadow-sm">5 Kg</button>
                        <button type="button" onclick="window.toggleSize(this, '1 Dozen')" class="size-btn px-4 h-11 rounded-xl font-bold text-xs shadow-sm">1 Dozen</button>
                        <button type="button" onclick="window.toggleSize(this, '1/2 Dozen')" class="size-btn px-4 h-11 rounded-xl font-bold text-xs shadow-sm">1/2 Dozen</button>
                        <button type="button" onclick="window.toggleSize(this, '1 Bunch')" class="size-btn px-4 h-11 rounded-xl font-bold text-xs shadow-sm">1 Bunch</button>
                        <button type="button" onclick="window.toggleSize(this, '1 Box')" class="size-btn px-4 h-11 rounded-xl font-bold text-xs shadow-sm">1 Box</button>
                        <button type="button" onclick="window.toggleSize(this, '1 Pcs')" class="size-btn px-4 h-11 rounded-xl font-bold text-xs shadow-sm">1 Pcs</button>
                    </div>
                </div>

                <div>
                    <label class="block text-xs text-forest uppercase tracking-wider mb-3 font-bold flex items-center gap-2"><i class="fas fa-medal text-emerald"></i> Quality Variant</label>
                    <div class="flex flex-wrap gap-2.5" id="variantPickerBox"></div>
                </div>

                <div id="dynamicVariantUploads" class="space-y-4 bg-white/60 p-5 rounded-2xl border border-emerald/20 hidden shadow-inner">
                    <h3 class="text-xs font-bold text-emerald uppercase tracking-widest mb-2"><i class="fas fa-camera mr-1"></i> Image For Selected Variants</h3>
                    <div id="variantImageContainers" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5"></div>
                </div>

                <button type="submit" id="saveProductBtn" class="w-full btn-emerald h-14 rounded-xl font-bold tracking-widest uppercase transition-all text-sm mt-4">
                    <i class="fas fa-upload mr-2"></i> Publish Harvest
                </button>
            </form>
        </section>

        <section id="section-categories" class="hidden space-y-6">
            <div class="flex items-center gap-3 border-b border-emerald/10 pb-3">
                <i class="fas fa-tags text-3xl text-emerald"></i>
                <h2 class="font-serif text-3xl font-bold text-forest">Aisle Manager</h2>
            </div>
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <form id="categoryForm" class="glass-panel p-6 rounded-3xl vip-glow emerald-border-glow md:col-span-2 space-y-5">
                    <div class="grid grid-cols-1 gap-5">
                        <div>
                            <label class="block text-xs text-forest uppercase tracking-wider mb-1.5 font-bold">Category Name</label>
                            <input type="text" id="newCategory" required placeholder="E.g. Exotic Fruits" oninput="window.updateCategoryPreview()" class="w-full input-premium rounded-xl h-12 px-4 text-sm font-medium">
                        </div>
                        <div class="p-4 border border-emerald/20 rounded-2xl bg-white shadow-sm">
                            <label class="block text-xs text-emerald uppercase tracking-wider mb-2 font-bold"><i class="fas fa-image mr-1"></i> Category Image</label>
                            <input type="url" id="catImgUrl" placeholder="Paste Image URL here..." oninput="window.updateCategoryPreview()" class="w-full input-premium rounded-lg h-10 px-3 text-xs mb-3 font-mono">
                            <div class="flex items-center gap-3 bg-gray-50 p-2 rounded-xl border border-gray-200">
                                <input type="file" accept="image/*" id="catImgFile" onchange="window.handleExtremeCompression(this, 'catImgBase64'); setTimeout(window.updateCategoryPreview, 500);" class="flex-1 text-xs text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-emerald file:text-white hover:file:bg-forest transition">
                            </div>
                            <input type="hidden" id="catImgBase64">
                        </div>
                    </div>
                    <button type="submit" class="w-full btn-emerald h-14 rounded-xl font-bold tracking-widest uppercase transition-all">
                        <i class="fas fa-plus mr-2"></i> Add Aisle
                    </button>
                </form>

                <div class="glass-panel p-6 rounded-3xl vip-glow flex flex-col items-center justify-center bg-gradient-to-b from-white to-gray-50 border-emerald/10">
                    <label class="block text-[10px] text-gray-400 uppercase tracking-widest mb-4 font-bold text-center w-full border-b border-gray-200 pb-2">Live App Preview</label>
                    <div class="flex flex-col items-center justify-center w-28 transform scale-110 my-6">
                        <div class="w-20 h-20 rounded-[1.5rem] border-2 border-emerald/30 shadow-[0_10px_20px_rgba(5,150,105,0.15)] flex items-center justify-center p-1 overflow-hidden bg-white">
                            <img id="catPreviewImg" src="" class="w-full h-full rounded-[1.2rem] object-cover hidden">
                            <i id="catPreviewIcon" class="fas fa-carrot text-3xl text-gray-300"></i>
                        </div>
                        <span id="catPreviewText" class="text-xs font-bold mt-3 text-forest text-center w-full truncate">Category</span>
                    </div>
                </div>
            </div>

            <div class="glass-panel p-6 rounded-3xl vip-glow border-emerald/10">
                <h3 class="text-xs font-bold text-gray-400 uppercase tracking-widest mb-4"><i class="fas fa-check-circle text-emerald mr-1"></i> Active Aisles</h3>
                <div id="categoriesList" class="flex flex-wrap gap-3"></div>
            </div>
        </section>

        <section id="section-banners" class="hidden space-y-6">
            <div class="flex items-center gap-3 border-b border-emerald/10 pb-3">
                <i class="fas fa-image text-3xl text-emerald"></i>
                <h2 class="font-serif text-3xl font-bold text-forest">Promo Banners (Hero App)</h2>
            </div>
            <form id="bannerForm" class="glass-panel p-6 rounded-3xl space-y-5 vip-glow emerald-border-glow max-w-3xl">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <div>
                        <label class="block text-xs text-forest uppercase tracking-wider mb-1.5 font-bold">Heading</label>
                        <input type="text" id="bTitle" placeholder="Fresh Harvest Sale" class="w-full input-premium rounded-xl h-12 px-4 text-sm font-medium">
                    </div>
                    <div>
                        <label class="block text-xs text-forest uppercase tracking-wider mb-1.5 font-bold">Sub-Text</label>
                        <input type="text" id="bDesc" placeholder="Up to 30% Off on Organics" class="w-full input-premium rounded-xl h-12 px-4 text-sm font-medium">
                    </div>
                </div>
                <div class="p-4 border border-emerald/20 rounded-2xl bg-white shadow-sm">
                    <label class="block text-xs text-emerald uppercase tracking-wider mb-2 font-bold">Banner Image</label>
                    <input type="url" id="bImgUrl" placeholder="Direct Image URL..." class="w-full input-premium rounded-lg h-10 px-3 text-xs mb-3 font-mono">
                    <div class="bg-gray-50 p-2 rounded-xl border border-gray-200">
                        <input type="file" accept="image/*" id="bImgFile" onchange="window.handleExtremeCompression(this, 'bImgBase64')" class="w-full text-xs text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-emerald file:text-white hover:file:bg-forest transition cursor-pointer">
                    </div>
                    <input type="hidden" id="bImgBase64">
                </div>
                <button type="submit" class="w-full btn-emerald h-14 rounded-xl font-bold tracking-widest uppercase transition-all">
                    <i class="fas fa-cloud-upload-alt mr-2"></i> Deploy Hero Banner
                </button>
            </form>
            <div id="bannersListContainer" class="grid grid-cols-1 md:grid-cols-2 gap-5 mt-6"></div>
        </section>

        <section id="section-inventory" class="hidden space-y-6">
            <div class="flex items-center gap-3 border-b border-emerald/10 pb-3">
                <i class="fas fa-boxes text-3xl text-emerald"></i>
                <h2 class="font-serif text-3xl font-bold text-forest">Master Inventory</h2>
            </div>
            <div id="inventoryContainer" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-5"></div>
        </section>

        <section id="section-orders" class="hidden space-y-6">
            <div class="flex items-center justify-between border-b border-emerald/10 pb-3 flex-wrap gap-4">
                <div class="flex items-center gap-3">
                    <i class="fas fa-truck-fast text-3xl text-emerald"></i>
                    <h2 class="font-serif text-3xl font-bold text-forest">Dispatch Hub</h2>
                </div>
                <div class="relative w-full md:w-auto">
                    <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"></i>
                    <input type="text" id="orderSearchInput" placeholder="Search ID, Name, Product..." 
                           oninput="window.filterOrders()" 
                           class="search-box">
                </div>
            </div>
            
            <div class="glass-panel p-2 rounded-2xl flex flex-wrap gap-2 w-full emerald-border-glow shadow-sm bg-white/80">
                <button onclick="window.switchOrderTab('success')" id="otab-success" class="order-tab active flex-1 min-w-[100px] text-center border border-transparent">
                    <i class="fas fa-check-circle mb-1 block text-lg"></i> Delivered
                </button>
                <button onclick="window.switchOrderTab('pending')" id="otab-pending" class="order-tab flex-1 min-w-[100px] text-center border border-gray-100">
                    <i class="fas fa-clock mb-1 block text-lg text-amber-500"></i> Active
                </button>
                <button onclick="window.switchOrderTab('returns')" id="otab-returns" class="order-tab flex-1 min-w-[100px] text-center border border-gray-100">
                    <i class="fas fa-undo-alt mb-1 block text-lg text-purple-500"></i> Returns
                </button>
                <button onclick="window.switchOrderTab('refunds')" id="otab-refunds" class="order-tab flex-1 min-w-[100px] text-center border border-gray-100">
                    <i class="fas fa-coins mb-1 block text-lg text-pink-500"></i> Refunds
                </button>
            </div>

            <div id="orderView-success" class="block space-y-4 mt-6"><div id="successOrdersList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5"></div></div>
            <div id="orderView-pending" class="hidden space-y-4 mt-6"><div id="pendingOrdersList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5"></div></div>
            <div id="orderView-returns" class="hidden space-y-4 mt-6"><div id="returnOrdersList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5"></div></div>
            <div id="orderView-refunds" class="hidden space-y-4 mt-6"><div id="refundOrdersList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5"></div></div>
        </section>

    </main>

    <script type="module">
        import { collection, doc, setDoc, getDoc, updateDoc, deleteDoc, onSnapshot, addDoc, collectionGroup, query } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
        import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
        import { db, auth } from './firebase-config.js';

        const ALLOWED_ADMINS = ["pradeepadmin111@gmail.com", "apnabazzaradmin111@gmail.com"];

        document.addEventListener("DOMContentLoaded", () => {
            window.allOrdersData = [];
            window.currentOrderTab = 'success';

            onAuthStateChanged(auth, (user) => {
                if (!user) { window.location.href = "login.html"; return; }
                const email = user.email.toLowerCase().trim();
                if (!ALLOWED_ADMINS.includes(email)) {
                    showPremiumToast("🚫 ACCESS DENIED!", "error");
                    signOut(auth); setTimeout(() => { window.location.href = "login.html"; }, 1500); return;
                }
                const sessionEl = document.getElementById('sessionDisplay');
                if(sessionEl) sessionEl.innerHTML = '<i class="fas fa-shield-alt mr-1"></i> SYS: ONLINE';
                
                loadCategories();
                loadInventory();
                loadOrders();
                loadBanners();
            });

            window.logout = async function() { await signOut(auth); localStorage.clear(); window.location.href = "login.html"; };

            window.selectedSizes = new Set();
            window.selectedColors = new Set();

            window.showPremiumToast = function(message, type = "success") {
                const container = document.getElementById('toast-container');
                if(!container) return;
                const toast = document.createElement('div');
                const bg = type === "success" ? "bg-emerald text-white border-emerald" : "bg-red-500 text-white border-red-500";
                toast.className = `toast-enter flex items-center gap-3 ${bg} px-5 py-4 rounded-2xl shadow-[0_15px_30px_rgba(0,0,0,0.2)] border-2 min-w-[250px] backdrop-blur-md font-bold text-sm`;
                toast.innerHTML = `<i class="fas ${type==='success'?'fa-check-circle':'fa-exclamation-triangle'} text-xl"></i> <span>${message}</span>`;
                container.appendChild(toast);
                setTimeout(() => { toast.style.opacity = '0'; toast.style.transform = 'translateY(-20px)'; toast.style.transition = 'all 0.4s'; setTimeout(() => toast.remove(), 400); }, 3000);
            };

            window.switchTab = function(tabName) {
                document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
                const tabEl = document.getElementById(`tab-${tabName}`);
                if(tabEl) tabEl.classList.add('active');
                document.querySelectorAll('main > section').forEach(sec => sec.classList.add('hidden'));
                const secEl = document.getElementById(`section-${tabName}`);
                if(secEl) secEl.classList.remove('hidden');
            };

            window.switchOrderTab = function(type) {
                window.currentOrderTab = type;
                document.querySelectorAll('.order-tab').forEach(b => { b.classList.remove('active', 'border-transparent'); b.classList.add('border-gray-100'); });
                const activeBtn = document.getElementById(`otab-${type}`);
                if(activeBtn) { activeBtn.classList.add('active', 'border-transparent'); activeBtn.classList.remove('border-gray-100'); }
                document.querySelectorAll('[id^="orderView-"]').forEach(el => el.classList.add('hidden'));
                const viewEl = document.getElementById(`orderView-${type}`);
                if(viewEl) { viewEl.classList.remove('hidden'); viewEl.classList.add('block'); }
                const searchEl = document.getElementById('orderSearchInput');
                if(searchEl) searchEl.value = ''; 
                window.filterOrders();
            };

            window.filterOrders = function() {
                const searchInput = document.getElementById('orderSearchInput');
                const searchTerm = searchInput ? searchInput.value.toLowerCase().trim() : '';
                window.renderOrders(searchTerm);
            };

            window.renderOrders = function(searchTerm = '') {
                const containers = { success: document.getElementById('successOrdersList'), pending: document.getElementById('pendingOrdersList'), returns: document.getElementById('returnOrdersList'), refunds: document.getElementById('refundOrdersList') };
                Object.values(containers).forEach(c => { if(c) c.innerHTML = ''; });
                let counts = { success: 0, pending: 0, returns: 0, refunds: 0 };
                
                window.allOrdersData.forEach(order => {
                    if (searchTerm && !`${order.orderId} ${order.customerName} ${order.productName}`.toLowerCase().includes(searchTerm)) return;
                    const cardHtml = window.createOrderCard(order);
                    if (order.status === 'Delivered') { if(containers.success) containers.success.innerHTML += cardHtml; counts.success++; } 
                    else if (['Pending', 'Cancelled', 'Placed', 'Processing', 'Out for Delivery'].includes(order.status)) { if(containers.pending) containers.pending.innerHTML += cardHtml; counts.pending++; } 
                    else if (['Returned', 'Return Requested', 'Return Approved', 'Return Processing'].includes(order.status)) { if(containers.returns) containers.returns.innerHTML += cardHtml; counts.returns++; } 
                    else if (order.status === 'Refunded') { if(containers.refunds) containers.refunds.innerHTML += cardHtml; counts.refunds++; }
                });
                
                if (counts.success === 0 && containers.success) containers.success.innerHTML = '<p class="text-sm text-gray-400 font-bold p-6 text-center col-span-full border-2 border-dashed border-gray-200 rounded-2xl w-full">No completed deliveries.</p>';
                if (counts.pending === 0 && containers.pending) containers.pending.innerHTML = '<p class="text-sm text-gray-400 font-bold p-6 text-center col-span-full border-2 border-dashed border-gray-200 rounded-2xl w-full">No active harvest orders.</p>';
                if (counts.returns === 0 && containers.returns) containers.returns.innerHTML = '<p class="text-sm text-gray-400 font-bold p-6 text-center col-span-full border-2 border-dashed border-gray-200 rounded-2xl w-full">No return requests.</p>';
                if (counts.refunds === 0 && containers.refunds) containers.refunds.innerHTML = '<p class="text-sm text-gray-400 font-bold p-6 text-center col-span-full border-2 border-dashed border-gray-200 rounded-2xl w-full">No refunds processed.</p>';
            };

            window.createOrderCard = function(order) {
                const isReturn = ['Returned', 'Return Requested', 'Return Approved', 'Return Processing'].includes(order.status);
                const isRefund = order.status === 'Refunded'; const isSuccess = order.status === 'Delivered'; const isPending = ['Pending', 'Cancelled', 'Placed', 'Processing', 'Out for Delivery'].includes(order.status);
                let cardClass = 'order-card '; if (isSuccess) cardClass += 'success'; else if (isPending) cardClass += 'pending'; else if (isReturn) cardClass += 'return'; else if (isRefund) cardClass += 'refund';
                if (order.status === 'Cancelled') cardClass += ' cancelled';
                let badgeClass = 'badge-'; if (isSuccess) badgeClass += 'success'; else if (isPending) badgeClass += 'pending'; else if (isReturn) badgeClass += 'return'; else if (isRefund) badgeClass += 'refund';
                if (order.status === 'Cancelled') badgeClass = 'badge-cancelled';
                let btnHtml = ''; const isAgentConfirmed = order.agentConfirmed || false;
                
                if (isRefund || isReturn || isSuccess) {
                    let actionBadgeText = isAgentConfirmed ? '<span class="text-[10px] text-emerald font-bold block mt-1"><i class="fas fa-shield-check"></i> Agent Confirmed</span>' : '';
                    btnHtml = `<div class="mt-4 space-y-2 border-t border-gray-100 pt-3">${actionBadgeText}<button onclick="window.deleteOrder('${order.userKey}', '${order.itemKey}')" class="w-full bg-gray-100 hover:bg-red-50 hover:text-red-500 text-gray-500 py-2.5 rounded-xl text-[11px] font-bold transition flex items-center justify-center gap-1 border border-gray-200"><i class="fas fa-trash-alt"></i> Archive from Admin</button></div>`;
                } else {
                    if (!isAgentConfirmed) {
                        btnHtml = `<div class="flex gap-2 mt-4 pt-3 border-t border-gray-100"><button onclick="window.updateOrderStatus('${order.userKey}', '${order.itemKey}', 'Delivered')" class="flex-1 bg-emerald text-white py-2.5 rounded-xl text-[11px] font-bold shadow-md hover:bg-forest transition"><i class="fas fa-check mr-1"></i> Force Deliver</button><button onclick="window.deleteOrder('${order.userKey}', '${order.itemKey}')" class="flex-1 bg-gray-100 text-gray-500 py-2.5 rounded-xl text-[11px] font-bold hover:bg-red-50 hover:text-red-500 border border-gray-200 transition"><i class="fas fa-trash-alt mr-1"></i> Archive</button></div>`;
                    } else {
                        btnHtml = `<div class="mt-4 pt-3 border-t border-gray-100"><span class="text-[10px] text-emerald font-bold block mb-2"><i class="fas fa-shield-check"></i> Agent Confirmed</span><button onclick="window.deleteOrder('${order.userKey}', '${order.itemKey}')" class="w-full bg-gray-100 hover:bg-red-50 hover:text-red-500 text-gray-500 py-2.5 rounded-xl text-[11px] font-bold transition flex items-center justify-center gap-1 border border-gray-200"><i class="fas fa-trash-alt"></i> Archive from Admin</button></div>`;
                    }
                }
                return `<div class="glass-card p-5 rounded-[1.5rem] shadow-sm flex flex-col justify-between vip-glow bg-white/90 ${cardClass}"><div class="flex justify-between items-start mb-3 pb-3"><div class="flex gap-4 w-[75%]"><div class="w-16 h-16 rounded-xl overflow-hidden bg-gray-50 shrink-0 border border-emerald/10 shadow-inner"><img src="${order.imgSrc}" loading="lazy" class="w-full h-full object-cover"></div><div class="min-w-0"><h4 class="text-forest font-bold text-[13px] leading-tight truncate">${order.productName}</h4><p class="text-gray-400 font-bold text-[9px] mt-1.5 uppercase tracking-wide">Var: <span class="text-emerald">${order.color || 'N/A'}</span> | Pk: <span class="text-emerald">${order.size || 'N/A'}</span> | Qty: <span class="text-emerald">${order.quantity || 1}</span></p><p class="text-gray-400 font-medium text-[9px] mt-1"><i class="far fa-clock text-emerald mr-0.5"></i> ${order.timestamp}</p></div></div><div class="w-[25%] text-right"><span class="px-2 py-1 rounded-md text-[9px] font-bold uppercase tracking-wider block text-center shadow-sm ${badgeClass}">${order.status}</span></div></div><div class="text-[10px] text-forest font-medium space-y-1.5 bg-emerald/5 p-3 rounded-xl border border-emerald/10 shadow-inner"><div class="flex justify-between border-b border-emerald/10 pb-1.5 mb-1.5"><span class="text-gray-400">Order ID:</span> <span class="font-mono font-bold">${order.orderId}</span></div><p class="truncate"><i class="fas fa-user text-emerald w-4"></i> ${order.customerName}</p><p><i class="fas fa-phone text-emerald w-4"></i> +91 ${order.contactPhone}</p><p class="truncate"><i class="fas fa-map-marker-alt text-emerald w-4"></i> ${order.address}</p><div class="text-forest font-extrabold text-sm mt-2 pt-2 border-t border-emerald/10 flex justify-between items-center"><span>Total Value:</span> <span class="text-emerald text-base">₹${order.totalValue}</span></div></div>${btnHtml}</div>`;
            };

            window.handleExtremeCompression = function(inputElement, targetId) {
                const file = inputElement.files[0];
                if(!file) return;
                showPremiumToast("🖼️ Processing Image...", "success");
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = function(event) {
                    const img = new Image(); img.src = event.target.result;
                    img.onload = function() {
                        const canvas = document.createElement('canvas'); const MAX_WIDTH = 800;
                        let width = img.width, height = img.height;
                        if (width > MAX_WIDTH) { height = Math.round((height * MAX_WIDTH) / width); width = MAX_WIDTH; }
                        canvas.width = width; canvas.height = height;
                        const ctx = canvas.getContext('2d'); ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
                        ctx.drawImage(img, 0, 0, width, height);
                        const compressedBase64 = canvas.toDataURL('image/webp', 0.85);
                        const targetEl = document.getElementById(targetId);
                        if(targetEl) targetEl.value = compressedBase64;
                        if(targetId.startsWith('b64_')) {
                            const colName = targetId.replace('b64_', ''); const prevDiv = document.getElementById(`prev_${colName}`);
                            if(prevDiv) prevDiv.innerHTML = `<img src="${compressedBase64}" class="w-full h-full object-cover rounded-lg mt-2 border-2 border-emerald/30 shadow-sm">`;
                        }
                        showPremiumToast(`✅ Image optimized!`);
                    }
                };
            };

            window.updateCategoryPreview = function() {
                const newCatEl = document.getElementById('newCategory');
                const name = newCatEl ? (newCatEl.value || "Category") : "Category";
                const textEl = document.getElementById('catPreviewText');
                if(textEl) textEl.innerText = name;
                const catUrlEl = document.getElementById('catImgUrl');
                const catB64El = document.getElementById('catImgBase64');
                const img = (catUrlEl ? catUrlEl.value : '') || (catB64El ? catB64El.value : '');
                const imgEl = document.getElementById('catPreviewImg'); const iconEl = document.getElementById('catPreviewIcon');
                if(img && imgEl && iconEl) { imgEl.src = img; imgEl.classList.remove('hidden'); iconEl.classList.add('hidden'); } 
                else if(imgEl && iconEl) { imgEl.classList.add('hidden'); iconEl.classList.remove('hidden'); }
            };

            window.toggleSize = function(btn, val) {
                btn.classList.toggle('selected');
                if(window.selectedSizes.has(val)) window.selectedSizes.delete(val); else window.selectedSizes.add(val);
            };

            window.toggleColor = function(btn, val) {
                btn.classList.toggle('selected');
                if(window.selectedColors.has(val)) window.selectedColors.delete(val); else window.selectedColors.add(val);
                window.generateColorUploaders();
            };

            const presetVariants = ["Organic", "Farm Fresh", "Hydroponic", "Premium", "Imported", "Standard", "Local"];
            const pickerBox = document.getElementById('variantPickerBox');
            if(pickerBox) {
                pickerBox.innerHTML = "";
                presetVariants.forEach(v => { pickerBox.innerHTML += `<button type="button" onclick="window.toggleColor(this, '${v}')" class="variant-btn px-4 h-11 rounded-xl font-bold text-xs shadow-sm bg-white">${v}</button>`; });
            }

            window.generateColorUploaders = function() {
                const container = document.getElementById('variantImageContainers'); const wrapper = document.getElementById('dynamicVariantUploads');
                if(!container || !wrapper) return;
                if(window.selectedColors.size === 0) { wrapper.classList.add('hidden'); container.innerHTML=""; return; }
                wrapper.classList.remove('hidden');
                const existingInputs = {};
                document.querySelectorAll('.col-b64-input').forEach(inp => { existingInputs[inp.dataset.col] = inp.value; });
                document.querySelectorAll('.col-url-input').forEach(inp => { if(inp.value) existingInputs[inp.dataset.col + "_url"] = inp.value; });
                container.innerHTML = "";
                Array.from(window.selectedColors).forEach(c => {
                    const safeC = c.replace(/\s+/g, '_'); const prevB64 = existingInputs[c] || ""; const prevUrl = existingInputs[c+"_url"] || "";
                    const showImg = prevUrl || prevB64 ? `<img src="${prevUrl || prevB64}" class="w-full h-full object-cover rounded-lg mt-2 border-2 border-emerald/30 shadow-sm">` : "";
                    container.innerHTML += `<div class="bg-white p-4 rounded-xl border border-emerald/10 shadow-sm"><span class="text-xs font-bold text-forest mb-2 block border-b border-gray-100 pb-2">${c} Image</span><input type="url" placeholder="URL (Optional)" class="col-url-input w-full input-premium rounded-lg h-9 px-3 text-[10px] mb-2 font-mono" data-col="${c}" value="${prevUrl}"><div class="bg-gray-50 p-1.5 rounded-lg border border-gray-200"><input type="file" accept="image/*" onchange="window.handleExtremeCompression(this, 'b64_${safeC}')" class="w-full text-[10px] text-gray-500 file:mr-2 file:py-1 file:px-2 file:rounded file:border-0 file:bg-emerald file:text-white hover:file:bg-forest cursor-pointer"></div><input type="hidden" id="b64_${safeC}" class="col-b64-input" data-col="${c}" value="${prevB64}"><div id="prev_${safeC}" class="w-full aspect-[5/4] bg-gray-50 mt-3 rounded-lg border border-gray-100">${showImg}</div></div>`;
                });
            };

            // --- PRODUCT SUBMIT ---
            const pForm = document.getElementById('productForm');
            if(pForm) {
                pForm.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const btn = document.getElementById('saveProductBtn');
                    if(btn) { btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Deploying...'; btn.disabled = true; }
                    
                    const editIdEl = document.getElementById('editProductId');
                    const editId = editIdEl ? editIdEl.value : '';
                    const key = editId || `PRD_${Date.now()}`;
                    
                    let finalVariants = {}; let primaryImg = ""; const fallbackImage = "https://images.unsplash.com/photo-1542838132-92c53300491e?w=800";
                    
                    if(window.selectedColors.size === 0) { finalVariants['Standard'] = fallbackImage; primaryImg = fallbackImage; } 
                    else {
                        Array.from(window.selectedColors).forEach((col, idx) => {
                            const safeC = col.replace(/\s+/g, '_');
                            const urlInp = document.querySelector(`.col-url-input[data-col="${col}"]`);
                            const b64Inp = document.getElementById(`b64_${safeC}`);
                            const img = (urlInp && urlInp.value) || (b64Inp && b64Inp.value) || fallbackImage;
                            finalVariants[col] = img; if(idx === 0) primaryImg = img;
                        });
                    }

                    const nameEl = document.getElementById('pName');
                    const catEl = document.getElementById('pCategory');
                    const priceEl = document.getElementById('pPrice');
                    const discEl = document.getElementById('pDiscount');
                    const descEl = document.getElementById('pDesc');

                    const payload = {
                        name: nameEl ? nameEl.value : '',
                        category: catEl ? catEl.value : '',
                        price: priceEl ? Number(priceEl.value) : 0, 
                        offerPrice: (discEl && discEl.value) ? Number(discEl.value) : 0, 
                        description: descEl ? (descEl.value || '') : '',
                        sizes: Array.from(window.selectedSizes).join(', ') || '1 Kg',
                        colors: Array.from(window.selectedColors).join(', ') || 'Fresh',
                        colorImagesList: finalVariants,
                        imgSrc: primaryImg,
                        timestamp: Date.now()
                    };

                    try {
                        await setDoc(doc(db, "products", key), payload);
                        showPremiumToast(editId ? "Harvest Updated Successfully!" : "Harvest Deployed to Server!");
                        pForm.reset();
                        if(editIdEl) editIdEl.value = "";
                        window.selectedSizes.clear(); window.selectedColors.clear();
                        document.querySelectorAll('.size-btn, .variant-btn').forEach(b => b.classList.remove('selected'));
                        window.generateColorUploaders();
                    } catch(error) {
                        console.error("Firestore Save Error:", error);
                        alert("🚨 SAVE FAILED:\n" + error.message);
                        showPremiumToast("Error deploying harvest", "error");
                    }
                    if(btn) { btn.innerHTML = '<i class="fas fa-upload mr-2"></i> Publish Harvest'; btn.disabled = false; }
                });
            }

            // --- INVENTORY ---
            function loadInventory() {
                onSnapshot(collection(db, 'products'), (snapshot) => { 
                    const inv = document.getElementById('inventoryContainer'); 
                    if(!inv) return;
                    inv.innerHTML = ""; 
                    if (!snapshot.empty) { 
                        snapshot.forEach(docSnap => { 
                            const key = docSnap.id; const item = docSnap.data();
                            const price = item.offerPrice ? `<span class="text-emerald font-extrabold text-base">₹${item.offerPrice}</span> <span class="line-through text-gray-400 text-[10px] ml-1">₹${item.price}</span>` : `<span class="text-forest font-extrabold text-base">₹${item.price}</span>`; 
                            inv.innerHTML += `
                                <div class="glass-card rounded-[1.5rem] overflow-hidden shadow-sm border border-emerald/10 flex flex-col vip-glow bg-white">
                                    <div class="aspect-[5/4] w-full relative bg-gray-50 border-b border-emerald/5">
                                        <img src="${item.imgSrc}" loading="lazy" class="w-full h-full object-cover" onerror="this.src='https://via.placeholder.com/400?text=No+Image'">
                                        <span class="absolute top-2 left-2 bg-forest/90 text-white text-[9px] px-2 py-1 rounded-md font-bold uppercase tracking-wider shadow-sm">${item.category}</span>
                                    </div>
                                    <div class="p-3.5 flex-grow flex flex-col justify-between">
                                        <div><h3 class="font-sans text-forest font-bold text-xs truncate mb-1">${item.name}</h3><p class="">${price}</p></div>
                                        <div class="flex gap-2 pt-3 mt-2 border-t border-emerald/10">
                                            <button onclick="window.editProduct('${key}')" class="flex-1 bg-emerald/10 text-emerald border border-emerald/20 py-2 rounded-xl text-[10px] font-bold hover:bg-emerald hover:text-white transition shadow-sm">Edit</button>
                                            <button onclick="window.deleteProduct('${key}')" class="flex-1 bg-red-50 border border-red-200 text-red-500 py-2 rounded-xl text-[10px] font-bold hover:bg-red-500 hover:text-white transition shadow-sm">Delete</button>
                                        </div>
                                    </div>
                                </div>`; 
                        }); 
                    } else { inv.innerHTML = `<div class="col-span-full text-center py-10 bg-white rounded-3xl border border-emerald/10"><i class="fas fa-boxes text-3xl text-gray-200 mb-2"></i><p class="text-xs text-gray-400 font-bold">No harvest found.</p></div>`; }
                });
            }

            window.deleteProduct = async (key) => { if(confirm("Delete this harvest?")) { await deleteDoc(doc(db, "products", key)); showPremiumToast("Harvest Deleted!"); } };
            
            window.editProduct = async (key) => { 
                const snap = await getDoc(doc(db, "products", key)); 
                if(snap.exists()){ 
                    const item = snap.data(); 
                    const editIdEl = document.getElementById('editProductId'); if(editIdEl) editIdEl.value = key;
                    const pNameEl = document.getElementById('pName'); if(pNameEl) pNameEl.value = item.name; 
                    const pCatEl = document.getElementById('pCategory'); if(pCatEl) pCatEl.value = item.category; 
                    const pPriceEl = document.getElementById('pPrice'); if(pPriceEl) pPriceEl.value = item.price; 
                    const pDiscEl = document.getElementById('pDiscount'); if(pDiscEl) pDiscEl.value = item.offerPrice || ""; 
                    const pDescEl = document.getElementById('pDesc'); if(pDescEl) pDescEl.value = item.description || ""; 
                    window.selectedSizes.clear(); window.selectedColors.clear(); 
                    document.querySelectorAll('.size-btn').forEach(b => { b.classList.remove('selected'); if(item.sizes && item.sizes.includes(b.innerText)) { b.classList.add('selected'); window.selectedSizes.add(b.innerText); } }); 
                    document.querySelectorAll('.variant-btn').forEach(b => { b.classList.remove('selected'); const cName = b.innerText.trim(); if(item.colors && item.colors.includes(cName)) { b.classList.add('selected'); window.selectedColors.add(cName); } }); 
                    window.generateColorUploaders(); 
                    setTimeout(() => { if(item.colorImagesList) { Object.keys(item.colorImagesList).forEach(col => { const isB64 = item.colorImagesList[col].startsWith('data:'); const urlInp = document.querySelector(`.col-url-input[data-col="${col}"]`); const b64Inp = document.getElementById(`b64_${col.replace(/\s+/g, '_')}`); if(urlInp && !isB64) urlInp.value = item.colorImagesList[col]; if(b64Inp && isB64) b64Inp.value = item.colorImagesList[col]; }); } }, 200); 
                    const saveBtn = document.getElementById('saveProductBtn'); if(saveBtn) saveBtn.innerHTML = '<i class="fas fa-upload mr-2"></i> Update Harvest'; 
                    window.switchTab('products'); window.scrollTo(0, 0); 
                } 
            };

            // --- CATEGORIES ---
            function loadCategories() {
                onSnapshot(collection(db, 'categories'), (snapshot) => { 
                    const list = document.getElementById('categoriesList'); 
                    const select = document.getElementById('pCategory'); 
                    if(list) list.innerHTML = ""; 
                    if(select) select.innerHTML = "<option value='' disabled selected>Select Aisle</option>"; 
                    if(!snapshot.empty) { 
                        snapshot.forEach((docSnap) => { 
                            const k = docSnap.id; const v = docSnap.data();
                            const imgHtml = v.imgSrc ? `<img src="${v.imgSrc}" class="w-8 h-8 rounded-lg object-cover bg-gray-50 border border-emerald/20">` : '<i class="fas fa-carrot text-gray-400 mx-2"></i>';
                            if(list) list.innerHTML += `<div class="bg-white text-forest pl-1 pr-3 py-1 rounded-xl text-[11px] border border-emerald/20 flex items-center gap-2 font-bold shadow-sm">${imgHtml} <span class="truncate">${v.name}</span> <i onclick="window.deleteCategory('${k}')" class="fas fa-times-circle cursor-pointer text-gray-300 hover:text-red-500 ml-1 text-sm"></i></div>`; 
                            if(select) select.innerHTML += `<option value="${v.name}">${v.name}</option>`; 
                        }); 
                    } 
                });
            }

            const catForm = document.getElementById('categoryForm');
            if(catForm) {
                catForm.addEventListener('submit', async (e) => { 
                    e.preventDefault(); 
                    const newCatEl = document.getElementById('newCategory');
                    const name = newCatEl ? newCatEl.value.trim() : '';
                    if(!name) { showPremiumToast("Enter aisle name", "error"); return; }
                    const catUrlEl = document.getElementById('catImgUrl');
                    const catB64El = document.getElementById('catImgBase64');
                    const imgSrc = (catUrlEl ? catUrlEl.value : '') || (catB64El ? catB64El.value : '');
                    await setDoc(doc(db, "categories", Date.now().toString()), { name: name, imgSrc: imgSrc || '' }); 
                    catForm.reset(); if(catB64El) catB64El.value = "";
                    window.updateCategoryPreview(); showPremiumToast("Aisle Created!"); 
                });
            }

            window.deleteCategory = async (k) => { if(confirm("Delete this aisle?")) { await deleteDoc(doc(db, "categories", k)); showPremiumToast("Aisle Deleted!"); } };

            // --- ORDERS ---
            function loadOrders() {
                const itemsQuery = query(collectionGroup(db, 'items'));
                onSnapshot(itemsQuery, async (snapshot) => {
                    window.allOrdersData = [];
                    if(snapshot.empty) { window.renderOrders(); return; }
                    const userProfiles = {};
                    for (let docSnap of snapshot.docs) {
                        const itm = docSnap.data(); const iKey = docSnap.id; const userKey = docSnap.ref.parent.parent.id;
                        if(itm && typeof itm === 'object' && itm.name && !itm.adminHidden) {
                            if(!userProfiles[userKey]) {
                                try { const uSnap = await getDoc(doc(db, "users", userKey, "address", "default"));
                                    if(uSnap.exists()) userProfiles[userKey] = uSnap.data(); else userProfiles[userKey] = { fullName: "User", contactPhone: "N/A", streetDetails: "N/A" };
                                } catch(e) { userProfiles[userKey] = { fullName: "User", contactPhone: "N/A", streetDetails: "N/A" }; }
                            }
                            const uProfile = userProfiles[userKey];
                            const deliveryStatus = itm.orderDeliveryStatusState || "Pending"; const returnStatus = itm.returnStatusProfileState || "None";
                            let displayStatus = deliveryStatus;
                            if (["Return Requested", "Return Approved", "Return Processing", "Returned", "Completed"].includes(returnStatus)) { displayStatus = returnStatus === "Completed" ? "Returned" : returnStatus; } else if (returnStatus === "Refunded") { displayStatus = "Refunded"; } else if (deliveryStatus === "Returned" || deliveryStatus === "Refunded") { displayStatus = deliveryStatus; }
                            const agentConfirmed = itm.agentConfirmed || false; const timestampDate = itm.timestamp ? new Date(itm.timestamp).toLocaleString('en-IN', { hour12: true }) : "Recently"; const orderId = itm.orderId || `ORD-${(itm.timestamp || Date.now()).toString().slice(-6)}-${iKey.slice(-4)}`;
                            
                            window.allOrdersData.push({ userKey: userKey, itemKey: iKey, orderId: orderId, productName: itm.name, color: itm.color || 'Fresh', size: itm.size || '1Kg', quantity: itm.quantity || 1, price: itm.price || 0, totalValue: (itm.price || 0) * (itm.quantity || 1), imgSrc: itm.imgSrc || 'https://via.placeholder.com/80?text=No+Image', status: displayStatus, customerName: uProfile.fullName, contactPhone: uProfile.contactPhone, address: uProfile.streetDetails, timestamp: timestampDate, agentConfirmed: agentConfirmed });
                        }
                    }
                    window.renderOrders();
                }, (error) => { console.error(error); });
            }

            window.updateOrderStatus = async (userPath, itemKey, status) => {
                const itemRef = doc(db, "carts", userPath, "items", itemKey); const snap = await getDoc(itemRef);
                if (snap.exists() && snap.data().agentConfirmed === true) { showPremiumToast("Agent Confirmed! Admin cannot force.", "error"); return; }
                if(confirm(`Force deliver? Moves to agent's delivered section.`)) { await updateDoc(itemRef, { orderDeliveryStatusState: status, agentConfirmed: true, deliveryClosedTimestampEpoch: Date.now() }); showPremiumToast(`Order forced to ${status}!`); }
            };

            window.deleteOrder = async (userPath, itemKey) => { if(confirm("Archive from Admin Panel?")) { await updateDoc(doc(db, "carts", userPath, "items", itemKey), { adminHidden: true, adminHiddenAt: Date.now() }); showPremiumToast("Order Archived!"); } };

            // --- BANNERS ---
            function loadBanners() {
                onSnapshot(collection(db, 'banners_list'), (snapshot) => { 
                    const container = document.getElementById('bannersListContainer'); 
                    if(!container) return;
                    container.innerHTML = ""; 
                    if(!snapshot.empty) { 
                        snapshot.forEach(docSnap => { 
                            const key = docSnap.id; const data = docSnap.data();
                            container.innerHTML += `<div class="glass-card rounded-2xl overflow-hidden flex flex-col vip-glow border border-emerald/10 bg-white"><div class="w-full aspect-[21/9] relative bg-gray-50 border-b border-emerald/5"><img src="${data.imgSrc}" class="w-full h-full object-cover"></div><div class="p-4 flex justify-between items-center"><div class="truncate pr-2"><h4 class="font-bold text-xs text-forest truncate">${data.heading || "Promotion"}</h4></div><button onclick="window.deleteDBNode('banners_list', '${key}')" class="text-red-400 hover:text-red-500 bg-red-50 w-8 h-8 rounded-xl flex items-center justify-center border border-red-100 transition"><i class="fas fa-trash-alt text-xs"></i></button></div></div>`; 
                        }); 
                    } 
                });
            }

            const bannerForm = document.getElementById('bannerForm');
            if(bannerForm) {
                bannerForm.addEventListener('submit', async (e) => { 
                    e.preventDefault(); 
                    const bUrlEl = document.getElementById('bImgUrl');
                    const b64El = document.getElementById('bImgBase64');
                    const bTitleEl = document.getElementById('bTitle');
                    const bDescEl = document.getElementById('bDesc');

                    const imgSrc = (bUrlEl ? bUrlEl.value : '') || (b64El ? b64El.value : ''); 
                    if(!imgSrc) { showPremiumToast("Banner image required!", "error"); return; } 
                    await addDoc(collection(db, "banners_list"), { heading: bTitleEl ? bTitleEl.value : '', subText: bDescEl ? bDescEl.value : '', imgSrc: imgSrc, timestamp: Date.now() }); 
                    showPremiumToast("Banner Deployed!"); bannerForm.reset(); if(b64El) b64El.value = ""; 
                });
            }

            window.deleteDBNode = async (collectionName, key) => { if(confirm("Confirm Delete?")) { await deleteDoc(doc(db, collectionName, key)); showPremiumToast("Deleted successfully!"); } };
        });
    </script>
</body>
</html>

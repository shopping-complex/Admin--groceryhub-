<!DOCTYPE html>
<html lang="en" class="scroll-smooth select-none">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>👑 Admin Portal | Grocery Hub</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { forest: '#022C22', emerald: '#059669', light: '#F4F4F5' },
                    fontFamily: { serif: ['Playfair Display', 'serif'], sans: ['Plus Jakarta Sans', 'sans-serif'] }
                }
            }
        }
    </script>
    <style>
        body { background: #F4F4F5; color: #022C22; font-family: 'Plus Jakarta Sans', sans-serif; min-height: 100vh; }
        .glass-panel { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(20px); border: 1px solid rgba(5, 150, 105, 0.15); box-shadow: 0 10px 40px rgba(2, 44, 34, 0.08); }
        .input-premium { background: #fff; border: 1px solid #e2e8f0; color: #022C22; height: 48px; padding: 0 16px; border-radius: 12px; width: 100%; font-size: 14px; }
        .input-premium:focus { border-color: #059669; outline: none; box-shadow: 0 0 0 4px rgba(5, 150, 105, 0.15); }
        .tab-btn.active { background: linear-gradient(135deg, #022C22, #059669); color: white; }
        .tab-btn { background: rgba(255,255,255,0.8); color: #475569; border: 1px solid #e2e8f0; }
        .size-btn.selected, .variant-btn.selected { background: #059669 !important; color: white !important; }
        .size-btn, .variant-btn { border: 1px solid #e2e8f0; background: #fff; color: #022C22; cursor: pointer; padding: 10px 16px; border-radius: 10px; font-weight: 700; font-size: 12px; }
        .btn-emerald { background: #059669; color: white; font-weight: 700; border: none; cursor: pointer; border-radius: 12px; height: 50px; width: 100%; text-transform: uppercase; letter-spacing: 1px; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-4xl mx-auto space-y-6">
        <div class="flex justify-between items-center glass-panel p-4 rounded-2xl">
            <h1 class="font-serif text-2xl font-bold text-forest">Grocery Hub <span class="text-emerald">Admin</span></h1>
            <button onclick="localStorage.clear(); window.location.href='login.html';" class="bg-red-50 text-red-600 px-4 py-2 rounded-xl text-xs font-bold">Logout</button>
        </div>

        <div class="flex gap-2">
            <button onclick="switchTab('products')" id="tab-products" class="tab-btn active px-5 py-3 rounded-xl text-xs font-bold uppercase">Add Product</button>
            <button onclick="switchTab('inventory')" id="tab-inventory" class="tab-btn px-5 py-3 rounded-xl text-xs font-bold uppercase">Inventory</button>
        </div>

        <section id="section-products" class="glass-panel p-6 rounded-3xl space-y-5">
            <h2 class="text-lg font-bold text-forest">Publish New Harvest</h2>
            
            <form id="productForm" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold uppercase text-forest mb-1">Product Name</label>
                    <input type="text" id="pName" required placeholder="E.g. Organic Avocados" class="input-premium">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold uppercase text-forest mb-1">Category / Aisle</label>
                        <select id="pCategory" required class="input-premium">
                            <option value="" disabled selected>Select Category</option>
                            <option value="Fruits">Fruits</option>
                            <option value="Vegetables">Vegetables</option>
                            <option value="Dairy">Dairy</option>
                            <option value="Exotic">Exotic</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold uppercase text-forest mb-1">Price (₹)</label>
                        <input type="number" id="pPrice" required placeholder="100" min="1" class="input-premium">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-bold uppercase text-forest mb-1">Image URL</label>
                    <input type="url" id="pImgUrl" required placeholder="https://images.unsplash.com/..." class="input-premium">
                </div>

                <button type="submit" id="saveProductBtn" class="btn-emerald mt-4">
                    <i class="fas fa-upload mr-2"></i> Publish Harvest Now
                </button>
            </form>
        </section>

        <section id="section-inventory" class="glass-panel p-6 rounded-3xl hidden space-y-4">
            <h2 class="text-lg font-bold text-forest">Live Inventory</h2>
            <div id="inventoryContainer" class="grid grid-cols-2 md:grid-cols-3 gap-4"></div>
        </section>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
        import { initializeFirestore, collection, doc, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

        // 🔥 YOUR EXACT FIREBASE CREDENTIALS
        const firebaseConfig = {
            apiKey: "AIzaSyDJBRGvsXS_0x6sKlLETdFq2_FckiX0ao8", 
            authDomain: "grocery-hub-e8ae2.firebaseapp.com",
            projectId: "grocery-hub-e8ae2",
            storageBucket: "grocery-hub-e8ae2.firebasestorage.app",
            messagingSenderId: "1038208251449",
            appId: "1:1038208251449:web:895a459cc01a1193e9bfe8"
        };

        const app = initializeApp(firebaseConfig);
        const db = initializeFirestore(app, { experimentalForceLongPolling: true });
        const auth = getAuth(app);

        // Auth Guardian
        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.href = "login.html";
            }
        });

        // Tab Switcher
        window.switchTab = function(tabName) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(`tab-${tabName}`).classList.add('active');
            document.getElementById('section-products').classList.add('hidden');
            document.getElementById('section-inventory').classList.add('hidden');
            document.getElementById(`section-${tabName}`).classList.remove('hidden');
        };

        // 🚀 FORM SUBMIT WITH EXPLICIT ERROR ALERTING
        const pForm = document.getElementById('productForm');
        pForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('saveProductBtn');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> Saving to Server...';
            btn.disabled = true;

            const key = `PRD_${Date.now()}`;
            const payload = {
                name: document.getElementById('pName').value.trim(),
                category: document.getElementById('pCategory').value,
                price: Number(document.getElementById('pPrice').value),
                imgSrc: document.getElementById('pImgUrl').value.trim(),
                timestamp: Date.now()
            };

            try {
                console.log("Pushing to Firestore...", payload);
                await setDoc(doc(db, "products", key), payload);
                alert("🎉 SUCCESS! Product Firebase server par save ho gaya!");
                pForm.reset();
            } catch (error) {
                console.error("Firebase Error:", error);
                alert("❌ FIRESTORE ERROR:\n" + error.code + "\n\n" + error.message);
            } finally {
                btn.innerHTML = '<i class="fas fa-upload mr-2"></i> Publish Harvest Now';
                btn.disabled = false;
            }
        });

        // Load Inventory
        onSnapshot(collection(db, 'products'), (snapshot) => {
            const inv = document.getElementById('inventoryContainer');
            inv.innerHTML = "";
            if (snapshot.empty) {
                inv.innerHTML = `<p class="text-xs text-gray-400 col-span-full">No products in inventory yet.</p>`;
                return;
            }
            snapshot.forEach((docSnap) => {
                const item = docSnap.data();
                const id = docSnap.id;
                inv.innerHTML += `
                    <div class="bg-white p-3 rounded-2xl border border-emerald/10 shadow-sm flex flex-col justify-between">
                        <img src="${item.imgSrc}" class="w-full h-28 object-cover rounded-xl mb-2">
                        <h4 class="font-bold text-xs text-forest truncate">${item.name}</h4>
                        <p class="text-emerald font-extrabold text-sm">₹${item.price}</p>
                        <button onclick="window.deleteItem('${id}')" class="mt-2 bg-red-50 text-red-500 py-1 rounded-lg text-[10px] font-bold">Delete</button>
                    </div>
                `;
            });
        });

        window.deleteItem = async (id) => {
            if(confirm("Delete this item?")) {
                await deleteDoc(doc(db, "products", id));
                alert("Item deleted successfully!");
            }
        };
    </script>
</body>
</html>
